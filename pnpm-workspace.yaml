packages:
  - "packages/*"
  - "apps/*"
  - "docs"
  - "bench"

# Centralized dev-dep versions. Reference via "catalog:" in package.json.
# Bump versions here, every package picks them up.
catalog:
  # typescript 7 ships no JS compiler API. tsup needs one for `dts: true`, so this is the
  # TypeScript team's own compatibility package (it aliases @typescript/old -> typescript@^6).
  # Declarations are generated by the 6 API; `tsc --noEmit` uses the native 7 checker.
  "@typescript/typescript6": ^6.0.2
  "@biomejs/biome": ^2.6.4
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  # Ceiling, not a pin: 7.60.1 bundles TypeScript 6.0.3 and cannot follow the `NodeJS`
  # global namespace, which packages/io and packages/ansi expose in their public API.
  # It fails with "Internal Error: Unable to follow symbol for \"NodeJS\"" and reports
  # itself as a software defect. Measured 2026-11-02: 7.58.7 (TypeScript 5.9.3) passes
  # locally, 7.60.1 fails in CI on the same source. Raise the ceiling once upstream fixes it.
  "@microsoft/api-extractor": ">=7.58.7 <7.60.0"
  "@commitlint/config-conventional": ^21.2.4
  "@types/node": ^26.6.6
  "@vitest/coverage-v8": ^5.0.5
  fast-check: ^4.10.2
  jsdom: ^30.1.3
  size-limit: ^14.3.0
  "@size-limit/preset-small-lib": ^14.3.0
  tsup: ^9.0.0
  turbo: ^2.11.10
  typescript: ^7.0.2
  vitest: ^5.0.5

# docs/ cannot take typescript 7: `astro check` is @astrojs/check, whose latest release
# (0.9.12, 2026-10-21) declares peerDependencies.typescript "^5.0.0 || ^6.0.0", and
# @volar/kit 2.4.30 narrowed its own peer to "<7". strict-peer-dependencies=true is
# deliberate, so this is a declared split rather than a disabled check. Raise to ^7 once
# @astrojs/check widens its range; nothing here watches for that.
catalogs:
  docs:
    typescript: ^6.0.3
