version: 2

updates:
  # GitHub Actions versions — these are SHA-pinned in workflows; dependabot
  # raises PRs that update both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope

  # pnpm catalog + workspace dev deps. Restricted to dev because we have a
  # CI gate forbidding runtime deps outside @simtabi/cli-kit-js-*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies]
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      tooling:
        patterns:
          - "@biomejs/*"
          - "@changesets/*"
          - "@commitlint/*"
          - "tsup"
          - "turbo"
          - "typescript"
      test:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "fast-check"
          - "jsdom"
      sizing:
        patterns:
          - "size-limit"
          - "@size-limit/*"
