name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**/README.md'
      - 'THREAT-MODEL.md'
      - 'SECURITY.md'
      - 'SECURITY-CHECKLIST.md'
      - 'README.md'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  build-and-deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter @simtabi/cli-kit-js-docs build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@1d5729f3ebe9da116e4ee8cc3f8bef72f87fbf6e # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=cli-kit-js
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Preview-deploy on PRs from forks of the same repo. Required secrets
      # are scoped to the workflow, so PRs from unrelated forks won't run.
      - name: Preview deploy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@1d5729f3ebe9da116e4ee8cc3f8bef72f87fbf6e # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=cli-kit-js --branch=${{ github.head_ref }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
