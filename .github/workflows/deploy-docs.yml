name: Deploy docs

# One GitHub Pages site for the repository: the Starlight docs at the root and the browser
# playground under /playground/. GitHub allows a single Pages site per repository, so both are
# assembled into one artifact and published by this workflow alone.
#
# This replaced a pair of Cloudflare Pages deploys that could never have worked. Measured
# 2026-11-02: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set on this repository (the
# action's own input echo omits them, which GitHub does for an empty input), cli-kit-js.pages.dev
# does not resolve, and no other repository in the estate uses Cloudflare -- while
# simtabi/printcraft-js and simtabi/jetbrains-youtrack-kit both publish with actions/deploy-pages.
# GitHub Pages needs no credential beyond the run's own token, so there is nothing left to set.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'packages/**/README.md'
      - 'packages/**/src/**'
      - 'THREAT-MODEL.md'
      - 'SECURITY.md'
      - 'SECURITY-CHECKLIST.md'
      - 'README.md'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'apps/playground/**'
      - 'packages/**/README.md'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Never cancel a publish in flight: a half-replaced Pages site is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true

      - run: pnpm install

      - name: Build the packages the playground imports
        run: pnpm build

      - name: Build docs site
        run: pnpm --filter @simtabi/cli-kit-js-docs build

      - name: Build playground
        run: pnpm --filter @simtabi/cli-kit-js-playground build

      - name: Assemble the site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R docs/dist/. _site/
          mkdir -p _site/playground
          cp -R apps/playground/dist/. _site/playground/
          # A publish that silently ships an empty directory is the failure worth catching.
          test -f _site/index.html || { echo "::error::docs build produced no index.html"; exit 1; }
          test -f _site/playground/index.html || { echo "::error::playground build produced no index.html"; exit 1; }
          echo "assembled $(find _site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    # Pull requests build the site and stop there: one Pages site per repository means there is
    # no preview to publish to, and replacing the live site from a pull request would be wrong.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
