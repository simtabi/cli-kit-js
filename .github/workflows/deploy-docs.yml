name: Deploy docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/**/README.md'
      - 'THREAT-MODEL.md'
      - 'SECURITY.md'
      - 'SECURITY-CHECKLIST.md'
      - 'README.md'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  build-and-deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true

      - run: pnpm install

      - name: Build docs site
        run: pnpm --filter @simtabi/cli-kit-js-docs build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=cli-kit-js
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Preview-deploy on PRs from forks of the same repo. Required secrets
      # are scoped to the workflow, so PRs from unrelated forks won't run.
      - name: Preview deploy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=cli-kit-js --branch=${{ github.head_ref }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
