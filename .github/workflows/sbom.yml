name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  generate:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install

      - name: Generate CycloneDX SBOM (workspace)
        run: |
          npx --yes @cyclonedx/cdxgen@10 \
            --output cli-kit-js.cdx.json \
            --spec-version 1.5 \
            --type application \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: cli-kit-js-sbom
          path: cli-kit-js.cdx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: cli-kit-js.cdx.json
