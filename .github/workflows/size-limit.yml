name: Size Limit

on:
  pull_request:
    branches: [main]

concurrency:
  group: size-limit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  size:
    name: Bundle size check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      - run: pnpm build
      - name: Check bundle sizes against per-package budgets
        # size-limit configs land in each package's package.json during M2-M4.
        # This step is a no-op until then; the workflow exists so the wiring
        # is in place from day one.
        run: |
          set -euo pipefail
          if pnpm -r exec -- node -e "process.exit(require('./package.json')['size-limit'] ? 0 : 1)" 2>/dev/null; then
            pnpm -r exec -- pnpm exec size-limit
          else
            echo "No size-limit config in any package yet; skipping."
          fi
