name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# Semgrep image is SHA-pinned. To bump:
#   curl -sI -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
#     -H "Authorization: Bearer $(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:semgrep/semgrep:pull' | jq -r .token)" \
#     "https://registry-1.docker.io/v2/semgrep/semgrep/manifests/<TAG>" \
#     | grep -i 'docker-content-digest'
# Then update the `image:` value below. Dependabot raises the PR when the tag moves.
jobs:
  scan:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # semgrep/semgrep:1.99 resolved 2026-05-11.
      image: semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude legacy \
            --exclude docs \
            --sarif \
            --output semgrep.sarif \
            --error || true

      - uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.27.4
        if: always()
        with:
          sarif_file: semgrep.sarif
