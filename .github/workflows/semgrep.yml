name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 2"

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

# Semgrep image is SHA-pinned. To bump:
#   curl -sI -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json" \
#     -H "Authorization: Bearer $(curl -s 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:semgrep/semgrep:pull' | jq -r .token)" \
#     "https://registry-1.docker.io/v2/semgrep/semgrep/manifests/<TAG>" \
#     | grep -i 'docker-content-digest'
# Then update the `image:` value below. Dependabot raises the PR when the tag moves.
jobs:
  scan:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # semgrep/semgrep:1.99 resolved 2026-05-11.
      image: semgrep/semgrep@sha256:ae27024c16f7848cdbfd49c24ed0b78b13f13b85fcd7b87c679aaa8b0c0dce98
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/javascript \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --exclude legacy \
            --exclude docs \
            --sarif \
            --output semgrep.sarif \
            --error || true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v3.27.4
        if: always()
        with:
          sarif_file: semgrep.sarif
