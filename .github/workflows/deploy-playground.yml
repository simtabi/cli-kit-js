name: Playground build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/**/src/**'
      - '.github/workflows/deploy-playground.yml'
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/**/src/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

concurrency:
  group: deploy-playground-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  build:
    name: Build the playground
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true

      - run: pnpm install

      - name: Build internal packages
        run: pnpm build

      - name: Build playground
        run: pnpm --filter @simtabi/cli-kit-js-playground build

      # Publishing moved to deploy-docs.yml, which assembles this build into the
      # repository's single GitHub Pages site under /playground/. What is left here is
      # the half that was always worth running: proof the playground still builds.
      - name: The build produced something
        run: |
          test -f apps/playground/dist/index.html \
            || { echo "::error::playground build produced no index.html"; exit 1; }
          echo "playground build: $(find apps/playground/dist -type f | wc -l) files"
