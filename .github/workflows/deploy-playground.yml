name: Deploy playground

on:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'packages/**/src/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-playground.yml'
  workflow_dispatch:

concurrency:
  group: deploy-playground-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  build-and-deploy:
    name: Build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build internal packages
        run: pnpm build

      - name: Build playground
        run: pnpm --filter @simtabi/cli-kit-js-playground build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@1d5729f3ebe9da116e4ee8cc3f8bef72f87fbf6e # v3.13.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/playground/dist --project-name=cli-kit-js-playground
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
