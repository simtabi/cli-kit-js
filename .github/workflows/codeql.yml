name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `actions` was only ever scanned by GitHub's default setup, which cannot coexist with
        # this advanced configuration -- so taking the advanced one back means scanning
        # workflows here instead. It is the language that finds script injection and
        # unpinned-action defects, which this repository had 52 of.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - legacy
              - docs

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
