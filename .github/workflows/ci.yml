name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs of the same workflow on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Every action reference must match the org pinning rule, offline and exactly: a third-party
      # action on the commit SHA of a named release, a first-party one (actions/, docker/, github/)
      # floating on its current major. Whether that release is the newest is Dependabot's job and
      # laranail/package-tools' verify-action-pins.py; nothing checked the *shape* until this step,
      # which is how the references here drifted off it with every check staying green.
      - name: Action pins match the rule
        run: |
          python3 - <<'PINS'
          import os, re, sys
          d = ".github/workflows"
          files = sorted(f for f in os.listdir(d) if f.endswith((".yml", ".yaml")))
          floor = 10
          if len(files) < floor:
              sys.exit(f"{len(files)} workflow files in {d}; floor is {floor}. "
                       "A search that stops matching must fail, not report a clean repository.")
          uses = re.compile(r"uses:\s*([\w.-]+/[\w./-]+?)@([\w./-]+?)([ \t]*#[ \t]*(\S+))?\s*$", re.M)
          bad, seen = [], 0
          for name in files:
              for ref, at, _, note in uses.findall(open(os.path.join(d, name)).read()):
                  if ref.startswith("./") or "/.github/workflows/" in ref:
                      continue                      # a local action or a reusable-workflow call
                  seen += 1
                  if ref.startswith(("actions/", "docker/", "github/")):
                      if not re.fullmatch(r"v\d+", at) or note:
                          bad.append(f"{name}: {ref}@{at} -- first-party, so float on a bare major tag")
                  elif not re.fullmatch(r"[0-9a-f]{40}", at):
                      bad.append(f"{name}: {ref}@{at} -- third-party, so pin to a commit SHA")
                  elif not note or re.fullmatch(r"v?\d+", note):
                      bad.append(f"{name}: {ref}@{at[:12]} # {note} -- name the release, not a mutable major")
          print("\n".join(f"  {b}" for b in bad))
          print(f"{seen} action references in {len(files)} workflow files; {len(bad)} off the rule")
          sys.exit(1 if bad else 0)
          PINS
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      - run: pnpm typecheck

  test:
    name: Test · Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      - run: pnpm build
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      # `pnpm audit` reads the lockfile and refuses without one
      # (ERR_PNPM_AUDIT_NO_LOCKFILE), and this repository tracks no lockfile by policy. So
      # one is computed here, in the runner's disposable checkout, and never committed: the
      # rule is about what the repository tracks, not about what a job computes and throws
      # away. Deleting this job instead would have removed a security control to satisfy a
      # rule about file tracking.
      - name: Audit the production tree against an ephemeral lockfile
        run: |
          sed -i '/^package-lock=false$/d' .npmrc
          pnpm install --lockfile-only
          pnpm audit --audit-level=high --prod

  api-surface:
    name: API surface (api-extractor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - run: pnpm install
      - run: pnpm build
      - name: Verify public API surface is unchanged
        run: pnpm api:check
      - name: Report — if this fails
        if: failure()
        run: |
          echo "::error::Public API surface changed. Run \`pnpm api:update\` locally and commit the updated etc/*.api.md files."
          echo "::error::Then add a major changeset if the change is breaking."

  no-external-runtime-deps:
    name: Verify zero external runtime deps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          # The runner's cached Node was 22.23.3 and astro 7.4.5 requires >=22.23.4;
          # with engine-strict=true that is a hard install failure, so take the newest 22.x.
          check-latest: true
      - name: Assert packages/* declare only @simtabi/cli-kit-js-* runtime deps
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for pkg in packages/*/package.json; do
            bad=$(node -e "
              const p = require('./' + process.argv[1]);
              const deps = p.dependencies || {};
              const bad = Object.keys(deps).filter(k => !k.startsWith('@simtabi/cli-kit-js-'));
              process.stdout.write(JSON.stringify(bad));
            " "$pkg")
            if [ "$bad" != "[]" ]; then
              echo "::error file=$pkg::External runtime dependencies forbidden. Only @simtabi/cli-kit-js-* allowed. Found: $bad"
              fail=1
            fi
          done
          exit $fail
