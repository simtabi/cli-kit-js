name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # required for npm provenance + Sigstore via OIDC
  attestations: write  # required for actions/attest-build-provenance

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  release:
    name: Version Packages or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@c2b6071637df7fb66e1ce5949ed738e1a31fce71 # v1.4.10
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Sigstore-signed attestation for every emitted tarball, on top of npm
      # provenance. Provides an air-gapped fallback against any single trust-
      # path compromise (npm OIDC + Sigstore both have to be broken to forge
      # a release). Only runs when changesets actually published something —
      # `published` is the action's output flag.
      - name: Pack tarballs for attestation
        if: steps.changesets.outputs.published == 'true'
        run: pnpm -r exec -- pnpm pack --pack-destination "$GITHUB_WORKSPACE/.tarballs"

      - name: Attest tarballs with Sigstore
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ".tarballs/*.tgz"
