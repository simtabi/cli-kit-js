name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write  # required for npm provenance + Sigstore via OIDC
  attestations: write  # required for actions/attest-build-provenance

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.0

jobs:
  release:
    name: Version Packages or Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - run: pnpm install

      - run: pnpm build

      - run: pnpm test

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish: pnpm release
          version: pnpm version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Sigstore-signed attestation for every emitted tarball, on top of npm
      # provenance. Provides an air-gapped fallback against any single trust-
      # path compromise (npm OIDC + Sigstore both have to be broken to forge
      # a release). Only runs when changesets actually published something —
      # `published` is the action's output flag.
      - name: Pack tarballs for attestation
        if: steps.changesets.outputs.published == 'true'
        run: pnpm -r exec -- pnpm pack --pack-destination "$GITHUB_WORKSPACE/.tarballs"

      - name: Attest tarballs with Sigstore
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ".tarballs/*.tgz"
